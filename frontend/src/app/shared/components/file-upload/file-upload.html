<div class="bg-white p-lg rounded-xl border-2 border-dashed"
     [ngClass]="isDragOver() ? 'border-secondary bg-secondary/5' : 'border-outline-variant'"
     (dragover)="onDragOver($event)"
     (dragleave)="onDragLeave()"
     (drop)="onDrop($event)">

  <div class="flex flex-col items-center justify-center py-xl text-center">
    <span class="material-symbols-outlined text-5xl text-secondary mb-md">cloud_upload</span>
    <h4 class="font-headline-sm text-primary mb-sm">Déposer les fichiers ici</h4>
    <p class="text-body-md text-on-surface-variant mb-lg">ou</p>
    <label class="px-lg py-sm bg-secondary text-white font-semibold rounded-lg hover:brightness-110 cursor-pointer transition-all">
      Parcourir les fichiers
      <input type="file" multiple hidden (change)="onFileSelected($event)" />
    </label>
    <p class="text-label-md text-on-surface-variant mt-lg">
      Formats autorisés : PDF, JPG, PNG, DOC, DOCX, XLS, XLSX<br/>
      Taille max : 10 Mo par fichier, 100 Mo au total
    </p>
  </div>

  @if (isUploading()) {
    <div class="mt-lg flex items-center gap-md">
      <div class="flex-1 bg-surface-container h-2 rounded-full overflow-hidden">
        <div class="bg-secondary h-full transition-all" [style.width.%]="uploadProgress()"></div>
      </div>
      <span class="text-body-sm font-semibold">{{ uploadProgress() }}%</span>
    </div>
    <p class="text-center text-body-md text-on-surface-variant mt-md">Upload en cours...</p>
  }

  @if (errorMessage()) {
    <div class="mt-lg p-md bg-error-container/20 border border-error/20 rounded-lg flex gap-md items-start">
      <span class="material-symbols-outlined text-error">error</span>
      <div>
        <p class="font-semibold text-error">Erreur lors de l'upload</p>
        <p class="text-body-sm text-on-error-container">{{ errorMessage() }}</p>
      </div>
    </div>
  }
</div>
