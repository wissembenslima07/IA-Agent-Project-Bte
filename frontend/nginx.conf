server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Sert les fichiers statiques (JS, CSS, images) normalement
    # Si aucun fichier ne correspond, renvoie index.html pour laisser
    # Angular Router gerer la route cote client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets versionnes par Angular (hash dans le nom de fichier)
    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpg|jpeg|gif)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Evite de mettre en cache index.html (sinon les utilisateurs restent
    # sur une ancienne version de l'app apres un nouveau deploiement)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Securite de base
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}