version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: credit-postgres
    environment:
      POSTGRES_DB: credit_db
      POSTGRES_USER: credit_user
      POSTGRES_PASSWORD: credit_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: credit-backend
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev

  ai-service:
    build: ./ai-service
    container_name: credit-ai-service
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: credit-frontend
    ports:
      - "4200:80"

volumes:
  pgdata: