version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bte-postgres
    environment:
      POSTGRES_DB: credit_db
      POSTGRES_USER: credit_user
      POSTGRES_PASSWORD: credit_pass
      # ✅ NEW: Initialiser avec superuser
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_user -d credit_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bte-network
    # ✅ NEW: Restart policy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bte-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/credit_db
      SPRING_DATASOURCE_USERNAME: credit_user
      SPRING_DATASOURCE_PASSWORD: credit_pass
      AI_SERVICE_URL: http://ai-service:8000
      # Timeout configuration (inférence LLM locale peut dépasser 60s par appel)
      APP_HTTP_AI_SERVICE_CONNECT_TIMEOUT: 10000
      APP_HTTP_AI_SERVICE_READ_TIMEOUT: 240000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/uploads
    networks:
      - bte-network
    restart: unless-stopped
    # ✅ NEW: Healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: bte-ai-service
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # ✅ NEW: Database (optionnel, si ai-service accède à la BD)
      DATABASE_URL: postgresql://credit_user:credit_pass@postgres:5432/credit_db
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - bte-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bte-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - bte-network
    restart: unless-stopped
    # ✅ NEW: Healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
    driver: local

networks:
  bte-network:
    driver: bridge