version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: bte-postgres
    environment:
      POSTGRES_DB: credit_db
      POSTGRES_USER: credit_user
      POSTGRES_PASSWORD: credit_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_user -d credit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bte-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/credit_db

  ai-service:
    build: ./ai-service
    container_name: bte-ai-service
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: bte-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata: