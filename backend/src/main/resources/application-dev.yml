spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/credit_db
    username: credit_user
    password: credit_pass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  threads:
    virtual:
      enabled: true

server:
  port: 8080