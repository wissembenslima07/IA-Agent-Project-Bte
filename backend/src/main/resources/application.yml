spring:
  application:
    name: credit-analysis-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB  
  profiles:
    active: dev

jwt:
  secret: NDA0ZTYzNTQ2ZTc0NzM2NTYzNzI2NTc0NGI2NTc5NDY2Zjcy
  expiration: 3600000   # 1h en millisecondes

storage:
  local:
    path: /uploads

# ============================================================
# HTTP CLIENT TIMEOUTS
# ============================================================
app:
  http:
    ai-service:
      connect-timeout: 10000    # 10 secondes (établir connexion)
      read-timeout: 240000      # 4 minutes (inférence LLM locale/CPU peut dépasser 60s par appel)

# URL du microservice IA
ai:
  service:
    url: http://ai-service:8000  # Docker compose
    # url: http://localhost:8000  # Local dev